spring.application.name=api-envios
spring.datasource.url=jdbc:${DB_JDBC_VENDOR:mysql}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:amor_em_mechas}?serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:rastreamento_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=always
